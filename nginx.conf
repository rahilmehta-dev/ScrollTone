server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # EPUB uploads + voice-clone reference clips can be several MB each —
    # nginx's default (1m) rejects those with a 413 before they ever reach
    # the backend.
    client_max_body_size 500m;

    # Proxy all API calls to the backend container
    location /api/ {
        proxy_pass         http://backend:7860/api/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

        # Required for SSE (Server-Sent Events) streaming
        proxy_http_version 1.1;
        proxy_set_header   Connection '';
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;

        # Generous timeout for long conversions
        proxy_read_timeout 3600s;
    }

    # Serve frontend static files; fall back to index.html for SPA routing.
    # no-cache forces revalidation (fast 304s via ETag) instead of letting
    # browsers fall back to heuristic caching, which can otherwise keep
    # serving index.html/app.js/style.css from a build several redesigns ago.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
